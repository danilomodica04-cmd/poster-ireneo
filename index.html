<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>In questa valigia</title>
<style>
  :root { --arancio: #ff360a; --nero: #0b0b0b; --bianco: #f4f1ec; }
  html, body { margin: 0; height: 100%; background: var(--nero); color: var(--bianco);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  #ar { position: fixed; inset: 0; }
  #ar video { object-fit: cover; }
  .schermo { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
    padding: max(24px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom)); box-sizing: border-box; z-index: 10; }
  #inizio { background: var(--nero); }
  .occhiello { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--arancio); margin: 0 0 10px; }
  h1 { font-size: clamp(40px, 13vw, 72px); line-height: .9; margin: 0; font-weight: 700; letter-spacing: -.02em; text-transform: uppercase; }
  .voce { margin: 14px 0 0; font-size: 15px; opacity: .75; }
  .istruzioni { font-size: 16px; line-height: 1.35; max-width: 30ch; margin: 0 0 18px; }
  button { appearance: none; border: 0; border-radius: 999px; font: inherit; font-size: 17px; font-weight: 700;
    padding: 16px 26px; cursor: pointer; }
  .primario { background: var(--arancio); color: #fff; width: 100%; }
  .secondario { background: transparent; color: var(--bianco); text-decoration: underline; padding: 14px 0 0; font-weight: 400; font-size: 15px; }
  #guida { pointer-events: none; justify-content: flex-end; align-items: center; text-align: center; }
  #guida .cornice { position: absolute; left: 50%; top: 46%; width: min(64vw, 46vh); aspect-ratio: 3 / 4;
    transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); border-radius: 6px; }
  #guida p { background: rgba(0,0,0,.55); padding: 10px 16px; border-radius: 999px; margin: 0; font-size: 15px; }
  #barra { position: fixed; left: 22px; right: 22px; bottom: max(18px, env(safe-area-inset-bottom)); height: 3px;
    background: rgba(255,255,255,.25); z-index: 11; display: none; }
  #barra i { display: block; height: 100%; width: 0; background: var(--arancio); }
  #solo { position: fixed; inset: 0; background: var(--nero); display: none; align-items: center; justify-content: center; z-index: 9; }
  #solo canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 3 / 4; height: 100vh; width: auto; }
  .nascosto { display: none !important; }
  #errore { color: var(--arancio); font-size: 15px; margin: 0 0 14px; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/three-addons/" } }
</script>
</head>
<body>
<div id="ar"></div>

<section id="inizio" class="schermo">
  <div>
    <p class="occhiello">Paese mio · poesia 02</p>
    <h1>In questa<br>valigia</h1>
    <p class="voce">Testo di Ireneo, letto da Felice</p>
  </div>
  <div>
    <p id="errore" class="nascosto"></p>
    <p class="istruzioni">Alza il volume e inquadra il poster: il segno arancione si muove con la voce.</p>
    <button id="avvia" class="primario">Inquadra il poster</button>
    <button id="senza" class="secondario">Ascolta senza poster</button>
  </div>
</section>

<section id="guida" class="schermo nascosto">
  <div class="cornice"></div>
  <p>Inquadra tutto il poster</p>
</section>

<div id="barra"><i></i></div>
<div id="solo"></div>

<script src="js/caleido.js"></script>
<script type="module">
import * as THREE from "three";
import { MindARThree } from "./lib/mindar-image-three.prod.js";

const $ = id => document.getElementById(id);
const A = "assets/p02/";
const ARANCIO = [255, 54, 10];
const W = 768, H = 1024;                 // tela del poster (3:4)

// ---------------------------------------------------------------- materiali
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const pronti = Promise.all([load(A + "photo_bn.jpg"), load(A + "plate.png")]);

// lastra stampata in arancione (per l'inizio e la fine)
function lastraArancio(plate) {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  const m = document.createElement("canvas"); m.width = W; m.height = H; const mx = m.getContext("2d");
  mx.drawImage(plate, 0, 0, W, H); mx.globalCompositeOperation = "multiply";
  mx.fillStyle = `rgb(${255 - ARANCIO[0]},${255 - ARANCIO[1]},${255 - ARANCIO[2]})`; mx.fillRect(0, 0, W, H);
  x.globalCompositeOperation = "difference"; x.drawImage(m, 0, 0);
  return c;
}

// ---------------------------------------------------------------- voce
const audio = new Audio(A + "voce.mp3"); audio.preload = "auto"; audio.crossOrigin = "anonymous";
let analisi = null;
async function analizza() {
  if (analisi) return analisi;
  const ab = await (await fetch(A + "voce.mp3")).arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await new Promise((ok, ko) => ctx.decodeAudioData(ab, ok, ko));
  analisi = await Caleido.analyse(buf); Caleido.setFeatures(analisi); ctx.close && ctx.close();
  return analisi;
}

// ---------------------------------------------------------------- disegno del poster
const tela = document.createElement("canvas"); tela.width = W; tela.height = H; const tx = tela.getContext("2d");
const D = Math.round(W * 1.45);                   // il simbolo copre la stessa area della lastra stampata
const segno = document.createElement("canvas"); segno.width = segno.height = D; const sx = segno.getContext("2d");
const strato = document.createElement("canvas"); strato.width = W; strato.height = H; const lx = strato.getContext("2d");
let foto, lastra, mix = 0, tPrima = performance.now(), t0 = performance.now();

function disegna(now) {
  const dt = Math.min(0.1, (now - tPrima) / 1000); tPrima = now;
  const s = (now - t0) / 1000;
  // 1. la foto respira: deriva lentissima e piccola variazione di scala
  const k = 1.035 + 0.012 * Math.sin(s * 2 * Math.PI / 14);
  const dx = W * 0.008 * Math.sin(s * 2 * Math.PI / 19), dy = H * 0.006 * Math.cos(s * 2 * Math.PI / 23);
  tx.globalCompositeOperation = "source-over";
  tx.save(); tx.translate(W / 2 + dx, H / 2 + dy); tx.scale(k, k); tx.drawImage(foto, -W / 2, -H / 2, W, H); tx.restore();
  // 2. il segno: la lastra stampata quando la voce tace, il simbolo di Caleido quando parla
  const parla = !audio.paused && !audio.ended;
  mix += ((parla ? 1 : 0) - mix) * Math.min(1, dt / 0.6);
  lx.globalCompositeOperation = "source-over"; lx.globalAlpha = 1; lx.fillStyle = "#fff"; lx.fillRect(0, 0, W, H);
  if (mix < 0.999) { lx.globalAlpha = 1 - mix; lx.drawImage(lastra, 0, 0); lx.globalAlpha = 1; }
  if (mix > 0.001 && analisi) {
    const sc = Caleido.build(D, D, audio.currentTime, dt, parla);
    Caleido.draw(sx, sc, 1, 1);
    sx.globalCompositeOperation = "multiply"; sx.fillStyle = `rgb(${255 - ARANCIO[0]},${255 - ARANCIO[1]},${255 - ARANCIO[2]})`; sx.fillRect(0, 0, D, D);
    sx.globalCompositeOperation = "source-over";
    lx.globalAlpha = mix; lx.globalCompositeOperation = "difference";
    lx.drawImage(segno, (W - D) / 2, (H - D) / 2);
    lx.globalCompositeOperation = "source-over"; lx.globalAlpha = 1;
  }
  tx.globalCompositeOperation = "multiply"; tx.drawImage(strato, 0, 0); tx.globalCompositeOperation = "source-over";
  if (analisi) $("barra").firstElementChild.style.width = (100 * audio.currentTime / (audio.duration || analisi.dur)) + "%";
}

// ---------------------------------------------------------------- realta' aumentata
let mind = null, texture = null;
async function avviaAR() {
  mind = new MindARThree({ container: $("ar"), imageTargetSrc: A + "target.mind", maxTrack: 1,
    uiLoading: "no", uiScanning: "no", uiError: "no", filterMinCF: 0.0001, filterBeta: 0.001 });
  const { renderer, scene, camera } = mind;
  texture = new THREE.CanvasTexture(tela);
  texture.colorSpace = THREE.SRGBColorSpace;
  const piano = new THREE.Mesh(new THREE.PlaneGeometry(1, H / W), new THREE.MeshBasicMaterial({ map: texture, toneMapped: false }));
  const ancora = mind.addAnchor(0); ancora.group.add(piano);
  ancora.onTargetFound = () => {
    $("guida").classList.add("nascosto"); $("barra").style.display = "block";
    if (audio.ended) audio.currentTime = 0;
    audio.play().catch(() => {});
  };
  ancora.onTargetLost = () => { audio.pause(); $("guida").classList.remove("nascosto"); };
  await mind.start();
  renderer.setAnimationLoop(now => { disegna(now); texture.needsUpdate = true; renderer.render(scene, camera); });
}

// ---------------------------------------------------------------- senza poster (piano B)
function avviaSolo() {
  $("solo").style.display = "flex"; $("solo").appendChild(tela); $("barra").style.display = "block";
  audio.currentTime = 0; audio.play().catch(() => {});
  tela.addEventListener("click", () => audio.paused ? audio.play() : audio.pause());
  const loop = now => { disegna(now); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
}

function errore(msg) { $("errore").textContent = msg; $("errore").classList.remove("nascosto"); }

$("avvia").addEventListener("click", async () => {
  $("avvia").disabled = true; $("avvia").textContent = "Avvio della fotocamera…";
  audio.play().then(() => audio.pause()).catch(() => {});      // sblocca l'audio con il tocco
  try {
    [foto, lastra] = await pronti; lastra = lastraArancio(lastra); disegna(performance.now());
    await analizza();
    await avviaAR();
    $("inizio").classList.add("nascosto"); $("guida").classList.remove("nascosto");
  } catch (e) {
    console.error(e);
    $("avvia").disabled = false; $("avvia").textContent = "Inquadra il poster";
    errore("La fotocamera non si è aperta. Controlla di aver dato il permesso al browser, oppure ascolta senza poster.");
  }
});
$("senza").addEventListener("click", async () => {
  audio.play().then(() => audio.pause()).catch(() => {});
  [foto, lastra] = await pronti; lastra = lastraArancio(lastra);
  await analizza();
  $("inizio").classList.add("nascosto"); avviaSolo();
});
audio.addEventListener("ended", () => { $("barra").firstElementChild.style.width = "100%"; });
window.__TEST__ = { audio, disegna, tela, get mind() { return mind; } };
</script>
</body>
</html>
